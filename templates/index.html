<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ZUPIUM</title>
<meta name="description" content="ZUPIUM, asisten AI cepat dan gratis.">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div id="starfield"></div>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>
<div class="scanline"></div>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="logo-orb">
          <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="19" cy="19" r="8" fill="url(#coreGradS)" filter="url(#glowS)"/>
            <circle cx="19" cy="19" r="8" fill="url(#coreGrad2S)" opacity="0.6"/>
            <g class="logo-ring">
              <ellipse cx="19" cy="19" rx="17" ry="7" stroke="url(#ringGradS)" stroke-width="1.2" fill="none" opacity="0.7"/>
            </g>
            <circle cx="19" cy="12" r="2" fill="#00c8ff" opacity="0.9"/>
            <defs>
              <radialGradient id="coreGradS" cx="35%" cy="35%">
                <stop offset="0%" stop-color="#7fffff"/>
                <stop offset="100%" stop-color="#0066cc"/>
              </radialGradient>
              <radialGradient id="coreGrad2S" cx="50%" cy="50%">
                <stop offset="0%" stop-color="#7b4fff" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="transparent"/>
              </radialGradient>
              <linearGradient id="ringGradS" x1="0" y1="0" x2="38" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00c8ff"/><stop offset="0.5" stop-color="#7b4fff"/><stop offset="1" stop-color="#00c8ff"/>
              </linearGradient>
              <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
          </svg>
        </div>
        <div>
          <span class="brand-name">ZUPIUM</span>
          <div class="brand-tag">Neural Intelligence System</div>
        </div>
      </div>
      <button class="icon-btn" id="closeSidebarBtn" aria-label="Tutup sidebar">✕</button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Obrolan baru
    </button>

    <div class="conv-list" id="convList">
    </div>

    <div class="sidebar-bottom">
      <div class="status-pill" id="statusPill">
        <span class="dot"></span> SYSTEM WORKING
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="openSidebarBtn" aria-label="Buka sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="conv-title" id="convTitle">Obrolan baru</h1>
      <button class="icon-btn" id="clearChatBtn" title="Hapus obrolan ini" aria-label="Hapus obrolan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6h12Z"/></svg>
      </button>
    </header>

    <section class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <div class="welcome-orb">
          <svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="45" cy="45" r="22" fill="url(#wCoreG)" filter="url(#wGlow)"/>
            <circle cx="45" cy="45" r="22" fill="url(#wCoreG2)" opacity="0.5"/>
            <ellipse cx="45" cy="45" rx="40" ry="16" stroke="url(#wRingG)" stroke-width="1.5" fill="none" opacity="0.6" class="ellipse-ring-1"/>
            <circle cx="45" cy="25" r="3.5" fill="#00c8ff" opacity="0.9" filter="url(#wGlow)"/>
            <defs>
              <radialGradient id="wCoreG" cx="35%" cy="35%">
                <stop offset="0%" stop-color="#aaffff"/>
                <stop offset="100%" stop-color="#0055bb"/>
              </radialGradient>
              <radialGradient id="wCoreG2" cx="50%" cy="50%">
                <stop offset="0%" stop-color="#7b4fff" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="transparent"/>
              </radialGradient>
              <linearGradient id="wRingG" x1="0" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00c8ff"/><stop offset="0.5" stop-color="#7b4fff"/><stop offset="1" stop-color="#00c8ff"/>
              </linearGradient>
              <filter id="wGlow" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="5" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
          </svg>
        </div>
        <h2 class="welcome-title">ZUPIUM</h2>
        <p class="welcome-sub">Sistem kecerdasan buatan online.<br>Tanyakan apa saja, saya siap membantu.</p>
        <div class="suggestions">
          <button class="sugg-card" data-prompt="Tampilkan Bumi dari satelit">
            <span class="s-icon">1</span>
            <span>Tampilkan Bumi dari satelit (NASA)</span>
          </button>
          <button class="sugg-card" data-prompt="Penjelasan singkat tentang Python">
            <span class="s-icon">2</span>
            <span>Python?</span>
          </button>
          <button class="sugg-card" data-prompt="Apa itu lubang hitam dan bagaimana lubang hitam terbentuk?">
            <span class="s-icon">3</span>
            <span>Apa itu lubang hitam?</span>
          </button>
          <button class="sugg-card" data-prompt="Jelaskan database secara singkat">
            <span class="s-icon">4</span>
            <span>Penjelasan Database secara singkat</span>
          </button>
        </div>
      </div>

      <div class="messages" id="messages"></div>
    </section>

    <form class="composer" id="composerForm">
      <div class="attachment-preview" id="attachmentPreview"></div>
      <div class="composer-inner">
        <div class="attach-wrap">
          <button type="button" class="icon-btn attach-btn" id="attachBtn" aria-label="Lampirkan file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="attach-menu" id="attachMenu">
            <button type="button" data-accept="image" class="attach-menu-item">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
              Upload gambar
            </button>
            <button type="button" data-accept="file" class="attach-menu-item">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
              Upload file
            </button>
          </div>
        </div>

        <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
        <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.xlsx,.xls,.pptx,.ppt,.ipynb,.txt,.md,.csv,.tsv,.json,.xml,.yaml,.yml,.py,.js,.jsx,.ts,.tsx,.html,.css,.scss,.php,.sql,.c,.cpp,.h,.hpp,.cs,.java,.kt,.swift,.go,.rs,.rb,.dart,.sh,.bat,.ps1,.r,.m,.lua,.tex,*/*" multiple hidden>

        <textarea
          id="messageInput"
          placeholder="Kirim pesan ke ZUPIUM..."
          rows="1"
          autocomplete="off"
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Kirim pesan">
          <span class="send-btn-ring"></span>
          <svg class="icon-send" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <p class="composer-hint" id="composerHint">ZUPIUM bisa saja salah. Periksa kembali informasi yang diberikan ZUPIUM
      </p>
    </form>
  </main>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
